<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PROVAI: do material de aula à prova com gabarito, com RAG e um pipeline de agentes">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08090f"/>
      <stop offset="0.55" stop-color="#0e0f1a"/>
      <stop offset="1" stop-color="#0a0b13"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#7b5cf0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7b5cf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a6b"/>
      <stop offset="0.5" stop-color="#e86aa8"/>
      <stop offset="1" stop-color="#7b5cf0"/>
    </linearGradient>
    <linearGradient id="marcaBorda" x1="1000" y1="0" x2="1150" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a6b"/>
      <stop offset="0.5" stop-color="#e86aa8"/>
      <stop offset="1" stop-color="#7b5cf0"/>
    </linearGradient>
    <marker id="seta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff8a6b"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="16" fill="url(#fundo)"/>
  <rect width="1200" height="380" rx="16" fill="url(#brilho)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="15.5" stroke="#262a3b"/>

  <!-- Título -->
  <text x="600" y="72" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="14" fill="#f4f5fa">PROVAI<tspan fill="#ff8a6b" letter-spacing="0">.</tspan></text>
  <rect x="572" y="86" width="56" height="3" rx="1.5" fill="url(#marca)"/>
  <text x="600" y="114" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#9aa0b8">Do material de aula à prova com gabarito: RAG + agentes que planejam, escrevem e revisam cada questão</text>

  <!-- Grupos -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="2" fill="#6b7190">
    <text x="220" y="158" text-anchor="middle">RAG · POSTGRES + PGVECTOR</text>
    <text x="695" y="158" text-anchor="middle">AGENTES LLM · GROQ</text>
    <text x="1075" y="158" text-anchor="middle">ENTREGA</text>
  </g>
  <g stroke="#3a3f57" stroke-width="1" fill="none">
    <path d="M50 172 v-5 h340 v5"/>
    <path d="M430 172 v-5 h530 v5"/>
    <path d="M1000 172 v-5 h150 v5"/>
  </g>

  <!-- Conexões entre as etapas -->
  <g stroke="#4a4466" stroke-width="2" stroke-dasharray="7 7">
    <line x1="200" y1="225" x2="240" y2="225">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="390" y1="225" x2="430" y2="225">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="580" y1="225" x2="620" y2="225">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="770" y1="225" x2="810" y2="225">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="960" y1="225" x2="1000" y2="225">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Ciclo de revisão (Reflection): revisor devolve a questão ao gerador -->
  <path d="M885 262 C885 312, 695 312, 695 266" stroke="#ff8a6b" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="5 6" fill="none" marker-end="url(#seta)">
    <animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <circle r="3.5" fill="#ff8a6b">
    <animateMotion path="M885 262 C885 312, 695 312, 695 266" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="790" y="324" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#c98a7a">reprovada? o gerador refaz com as críticas do revisor</text>

  <!-- Documentos atravessando o pipeline (passam por trás das etapas) -->
  <g>
    <g>
      <animateMotion path="M20 225 L1180 225" dur="8s" repeatCount="indefinite"/>
      <g transform="translate(-9,-11)">
        <path d="M0 2 a2 2 0 0 1 2 -2 h9 l7 7 v13 a2 2 0 0 1 -2 2 h-14 a2 2 0 0 1 -2 -2 z" fill="#ff8a6b"/>
        <path d="M11 0 L18 7 L11 7 Z" fill="#ffc2b3"/>
        <rect x="3" y="11" width="10" height="1.6" rx="0.8" fill="#0a0b13"/>
        <rect x="3" y="15" width="7" height="1.6" rx="0.8" fill="#0a0b13"/>
      </g>
    </g>
    <g>
      <animateMotion path="M20 225 L1180 225" dur="8s" begin="-4s" repeatCount="indefinite"/>
      <g transform="translate(-9,-11)">
        <path d="M0 2 a2 2 0 0 1 2 -2 h9 l7 7 v13 a2 2 0 0 1 -2 2 h-14 a2 2 0 0 1 -2 -2 z" fill="#9b82f5"/>
        <path d="M11 0 L18 7 L11 7 Z" fill="#d4c9fb"/>
        <rect x="3" y="11" width="10" height="1.6" rx="0.8" fill="#0a0b13"/>
        <rect x="3" y="15" width="7" height="1.6" rx="0.8" fill="#0a0b13"/>
      </g>
    </g>
  </g>

  <!-- Etapas -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <g>
      <rect x="50" y="190" width="150" height="70" rx="12" fill="#12131f" stroke="#33374d" stroke-width="1.5"/>
      <rect x="50" y="190" width="150" height="70" rx="12" fill="none" stroke="#ff8a6b" stroke-width="1.5" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="125" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#f1e9ff">UPLOAD</text>
      <text x="125" y="241" text-anchor="middle" font-size="10.5" fill="#868ca6">pdf · docx · txt</text>
    </g>
    <g>
      <rect x="240" y="190" width="150" height="70" rx="12" fill="#12131f" stroke="#33374d" stroke-width="1.5"/>
      <rect x="240" y="190" width="150" height="70" rx="12" fill="none" stroke="#f07a8c" stroke-width="1.5" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="0.7s" repeatCount="indefinite"/>
      </rect>
      <text x="315" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#f1e9ff">INDEXAÇÃO</text>
      <text x="315" y="241" text-anchor="middle" font-size="10.5" fill="#868ca6">trechos · MiniLM · 384 dims</text>
    </g>
    <g>
      <rect x="430" y="190" width="150" height="70" rx="12" fill="#12131f" stroke="#33374d" stroke-width="1.5"/>
      <rect x="430" y="190" width="150" height="70" rx="12" fill="none" stroke="#e86aa8" stroke-width="1.5" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
      <text x="505" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#f1e9ff">PLANEJADOR</text>
      <text x="505" y="241" text-anchor="middle" font-size="10.5" fill="#868ca6">tópicos do material</text>
    </g>
    <g>
      <rect x="620" y="190" width="150" height="70" rx="12" fill="#12131f" stroke="#33374d" stroke-width="1.5"/>
      <rect x="620" y="190" width="150" height="70" rx="12" fill="none" stroke="#c46ac8" stroke-width="1.5" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="2.1s" repeatCount="indefinite"/>
      </rect>
      <text x="695" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#f1e9ff">GERADOR</text>
      <text x="695" y="241" text-anchor="middle" font-size="10.5" fill="#868ca6">busca + questão + gabarito</text>
    </g>
    <g>
      <rect x="810" y="190" width="150" height="70" rx="12" fill="#12131f" stroke="#33374d" stroke-width="1.5"/>
      <rect x="810" y="190" width="150" height="70" rx="12" fill="none" stroke="#9b6ae6" stroke-width="1.5" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="2.8s" repeatCount="indefinite"/>
      </rect>
      <text x="885" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#f1e9ff">REVISOR</text>
      <text x="885" y="241" text-anchor="middle" font-size="10.5" fill="#868ca6">nota · fundamentação</text>
    </g>
    <g>
      <rect x="1000" y="190" width="150" height="70" rx="12" fill="#14122a" stroke="url(#marcaBorda)" stroke-width="1.5"/>
      <rect x="1000" y="190" width="150" height="70" rx="12" fill="none" stroke="#7b5cf0" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="3.5s" repeatCount="indefinite"/>
      </rect>
      <text x="1075" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#f1e9ff">PROVA</text>
      <text x="1075" y="241" text-anchor="middle" font-size="10.5" fill="#868ca6">PDF · DOCX · histórico</text>
    </g>
  </g>

  <text x="600" y="360" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5c6280">FastAPI · PostgreSQL 16 + pgvector · fastembed (ONNX) · Groq gpt-oss · Pydantic · React 19 · TanStack Router/Query · SSE · Docker</text>
</svg>
