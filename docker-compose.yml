name: ia-gerador-provas

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: provas
      POSTGRES_PASSWORD: provas
      POSTGRES_DB: provas
    ports:
      # Porta do host fora do padrão 5432 para não colidir com outro Postgres local.
      - "${PORTA_BANCO:-5442}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provas -d provas"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: desenvolvimento
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      URL_BANCO: postgresql+psycopg://provas:provas@db:5432/provas
      # O modelo de embeddings que vem na imagem. Fixado aqui porque o .env, pensado para
      # rodar fora do Docker, aponta para dados/modelos, que no container é a pasta
      # montada do Windows: lenta e com outra cópia do modelo.
      DIRETORIO_MODELOS: /opt/modelos
      EMBEDDINGS_SOMENTE_LOCAL: "true"
      # Eventos de arquivo do Windows não chegam ao container; o reload precisa de polling.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${PORTA_API:-8010}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: desenvolvimento
    environment:
      API_PROXY_ALVO: http://backend:8000
      VITE_POLLING: "true"
    ports:
      - "${PORTA_FRONTEND:-5173}:5173"
    volumes:
      - ./frontend:/app
      # node_modules fica no container: o do Windows tem binários de outra plataforma.
      - /app/node_modules
    depends_on:
      - backend

volumes:
  dados_postgres:
