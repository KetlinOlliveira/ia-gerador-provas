server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # O fluxo de eventos da geração (SSE) precisa sair sem buffer e sem timeout curto.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Rotas do React: qualquer caminho que não seja arquivo cai no index.html.
    location / {
        try_files $uri /index.html;
    }
}
